name: Inspect official hiking relations
on:
  push:
    branches: [chatgpt-official-routes]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-official-routes
      - name: Query Overpass
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, time
          refs=["GR 3","GR3","GR 48","GR48","GR 100","GR100","GR 42","GR42","GR 429","GR429","GR 9","GR9"]
          servers=["https://overpass.kumi.systems/api/interpreter","https://overpass-api.de/api/interpreter"]
          rows=[]
          for ref in refs:
              q=f'[out:json][timeout:30];rel["route"="hiking"]["ref"="{ref}"];out tags center;'
              data=urllib.parse.urlencode({"data":q}).encode()
              got=None
              for s in servers:
                  try:
                      req=urllib.request.Request(s,data=data,headers={"User-Agent":"ChatGPT-official-route-audit/1.0"})
                      with urllib.request.urlopen(req,timeout=50) as r: got=json.load(r)
                      break
                  except Exception:
                      time.sleep(2)
              if not got: continue
              for e in got.get("elements",[]):
                  t=e.get("tags",{})
                  c=e.get("center") or {}
                  # keep France/nearby by rough center
                  lat,lon=c.get("lat"),c.get("lon")
                  if lat is not None and not (41.0 <= lat <= 51.5 and -5.5 <= lon <= 10.0): continue
                  rows.append({"id":e["id"],"ref":t.get("ref"),"name":t.get("name"),"from":t.get("from"),"to":t.get("to"),"network":t.get("network"),"operator":t.get("operator"),"center":c})
              time.sleep(1)
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          with open("relations.json","w") as f: json.dump(rows,f,ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: official-route-relations
          path: relations.json
