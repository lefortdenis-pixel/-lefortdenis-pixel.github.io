name: Inspect official hiking relations

on:
  push:
    branches: [chatgpt-official-routes]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Overpass
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, time
          boxes={
            "touraine":"46.45,-0.25,47.45,1.95",
            "rhone":"44.05,4.35,44.70,5.45",
          }
          servers=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"]
          out={}
          for label,bbox in boxes.items():
              q=f'''[out:json][timeout:120];
              rel["route"="hiking"]({bbox});
              out tags ids;'''
              data=urllib.parse.urlencode({"data":q}).encode()
              err=None
              for s in servers:
                  try:
                      req=urllib.request.Request(s,data=data,headers={"User-Agent":"ChatGPT-official-route-audit/1.0"})
                      with urllib.request.urlopen(req,timeout=150) as r:
                          obj=json.load(r)
                      break
                  except Exception as e:
                      err=e; time.sleep(3)
              else: raise err
              vals=[]
              for e in obj.get("elements",[]):
                  t=e.get("tags",{})
                  ref=t.get("ref","")
                  name=t.get("name","")
                  txt=(ref+" "+name).lower()
                  if any(k in txt for k in ["gr 3","gr3","gr 48","gr48","gr 100","gr100","gr 4","gr4","gr 42","gr42","gr 429","gr429","gr 9","gr9","brenne","baronnies","dieulefit"]):
                      vals.append({"id":e["id"],"ref":ref,"name":name,"network":t.get("network"),"operator":t.get("operator"),"from":t.get("from"),"to":t.get("to")})
              out[label]=vals
          print(json.dumps(out,ensure_ascii=False,indent=2))
          with open("relations.json","w") as f: json.dump(out,f,ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: official-route-relations
          path: relations.json
