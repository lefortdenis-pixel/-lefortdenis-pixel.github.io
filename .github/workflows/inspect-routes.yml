name: Inspect official hiking relations
on:
  push:
    branches: [chatgpt-route-gen]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query Overpass
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.parse, urllib.request, json, time
          qs=[
            ("GR3_Saumur_Chinon",'[out:json][timeout:60];rel["route"="hiking"]["ref"~"GR ?3"](around:80000,47.20,0.05);out tags center;'),
            ("GR48_Chinon_Angles",'[out:json][timeout:60];rel["route"="hiking"]["ref"~"GR ?48"](around:120000,46.95,0.55);out tags center;'),
            ("GR100_Indre",'[out:json][timeout:60];rel["route"="hiking"]["ref"~"GR ?100"](around:150000,46.65,1.45);out tags center;'),
            ("GR42_Rhone",'[out:json][timeout:60];rel["route"="hiking"]["ref"~"GR ?42"](around:100000,44.35,4.65);out tags center;'),
            ("GR429",'[out:json][timeout:60];rel["route"="hiking"]["ref"~"GR ?429"](around:100000,44.50,4.95);out tags center;'),
            ("GR9_Drome_Vaucluse",'[out:json][timeout:60];rel["route"="hiking"]["ref"~"GR ?9"](around:140000,44.30,5.20);out tags center;'),
            ("GR4_Ventoux",'[out:json][timeout:60];rel["route"="hiking"]["ref"~"GR ?4"](around:70000,44.17,5.28);out tags center;'),
          ]
          for label,q in qs:
            url="https://overpass-api.de/api/interpreter?data="+urllib.parse.quote(q)
            req=urllib.request.Request(url,headers={"User-Agent":"ChatGPT-official-route-audit/1.0"})
            try:
              with urllib.request.urlopen(req,timeout=90) as r: data=json.load(r)
              print("\n###",label)
              for e in data.get("elements",[]):
                t=e.get("tags",{})
                print(e["id"], t.get("ref"), t.get("name"), t.get("from"), "->",t.get("to"), "network=",t.get("network"))
            except Exception as e: print("ERR",label,e)
            time.sleep(2)
          PY
