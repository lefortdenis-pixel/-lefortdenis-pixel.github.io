name: tmp-gpx-route-fetch
on:
  push:
    branches: [tmp-gpx-isolation-20260928]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GR9 child relation geometry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import requests
          S=requests.Session(); S.headers["User-Agent"]="route-research/1.0 (noncommercial)"
          ids=[16354746,16327838,16327680,16327655,16327013,16326955,16326907,16323235,16323149,16323117,16322804,16322320,16321157,16321001,16320988,16320000,16319760,16318813]
          for rid in ids:
              try:
                  r=S.get(f"https://api.openstreetmap.org/api/0.6/relation/{rid}/full",timeout=180)
                  print(rid,r.status_code,len(r.content),r.headers.get("content-type"))
                  if r.ok: open(f"out/osm_{rid}_full.xml","wb").write(r.content)
              except Exception as e: print("ERR",rid,e)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmp-gr9-children
          path: out
