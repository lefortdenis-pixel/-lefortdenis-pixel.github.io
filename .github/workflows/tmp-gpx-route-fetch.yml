name: tmp-gpx-route-fetch
on:
  push:
    branches: [tmp-gpx-isolation-20260928]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Search TrailSplits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import requests, json, urllib.parse, os
          qs=["GR 3","GR 48","GR 100","GR 4","GR 42","GR 429","GR 9"]
          all={}
          for q in qs:
              u="https://api.trailsplits.com/trails/v1/search"
              r=requests.get(u,params={"q":q,"limit":100,"type":"hiking"},timeout=60)
              print(q, r.status_code, len(r.content))
              r.raise_for_status()
              j=r.json(); all[q]=j
              for ft in j.get("features",[]):
                  p=ft.get("properties",{})
                  bbox=p.get("bbox")
                  if bbox and bbox[0] < 6 and bbox[2] > -1 and bbox[1] < 50 and bbox[3] > 43:
                      print("CAND",q,p)
          open("out/search.json","w").write(json.dumps(all,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmp-trailsplits-search
          path: out
