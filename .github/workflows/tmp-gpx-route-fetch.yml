name: tmp-gpx-route-fetch
on:
  push:
    branches: [tmp-gpx-isolation-20260928]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch targeted geometries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import requests,json,os
          S=requests.Session(); S.headers["User-Agent"]="route-research/1.0"
          for rid in [2704569,10169937,7457566,2410123,10670466,10670467]:
              u=f"https://hiking.waymarkedtrails.org/api/v1/details/relation/{rid}/geometry/gpx"
              try:
                  r=S.get(u,timeout=120); print("wmt",rid,r.status_code,len(r.content),r.headers.get("content-type"))
                  if r.ok: open(f"out/wmt_{rid}.gpx","wb").write(r.content)
              except Exception as e: print("ERR WMT",rid,e)
          for rid in [2196893,19349153,2804477,2791323,10699092,15740158,15010169,15010168,15010200,15009926]:
              try:
                  r=S.get(f"https://api.trailsplits.com/trails/v1/relation/{rid}",timeout=120); print("ts",rid,r.status_code,len(r.content))
                  if r.ok: open(f"out/ts_{rid}.json","wb").write(r.content)
              except Exception as e: print("ERR TS",rid,e)
          for name,box in {
             "saumur_chinon":{"min_lat":47.05,"min_lng":-0.15,"max_lat":47.32,"max_lng":0.35,"type":"hiking","limit":100},
             "dieulefit_ventoux":{"min_lat":44.15,"min_lng":4.95,"max_lat":44.55,"max_lng":5.40,"type":"hiking","limit":100}
          }.items():
             r=S.get("https://api.trailsplits.com/trails/v1/bbox",params=box,timeout=60); print("bbox",name,r.status_code,len(r.content))
             if r.ok: open(f"out/{name}.json","wb").write(r.content)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmp-target-geoms
          path: out
