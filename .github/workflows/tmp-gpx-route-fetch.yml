name: tmp-gpx-route-fetch
on:
  push:
    branches: [tmp-gpx-isolation-20260928]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch relevant OSM child relations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import requests,os
          S=requests.Session(); S.headers["User-Agent"]="route-research/1.0 (noncommercial)"
          ids=[12774885,13048526,13048672,11173071,18212755,18212756,18212758]
          for rid in ids:
              try:
                  r=S.get(f"https://api.openstreetmap.org/api/0.6/relation/{rid}/full",timeout=180)
                  print(rid,r.status_code,len(r.content),r.headers.get("content-type"))
                  if r.ok: open(f"out/osm_{rid}_full.xml","wb").write(r.content)
              except Exception as e: print("ERR",rid,e)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmp-osm-childroutes
          path: out
