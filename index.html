<body>
<main id="app">
<section class="mapwrap" id="mapwrap">
<div class="mapGrid"><div class="mapPane mapPaneMain"><div id="map" class="leafletMap"></div><span class="mapLabel" id="mapLabelLeft">Satellite</span></div><div class="mapPane mapPaneIgn"><div id="mapIgn" class="leafletMap"></div><span class="mapLabel" id="mapLabelRight">IGN aérien</span></div></div><div id="empty">Importe un GPX</div>
<aside class="hud" id="hud"><div class="hudHead"><span>Bivouacs</span><span class="mobileRemain" id="mobileRemain">—</span><label class="importBtn" for="gpx">Importer</label><input id="gpx" type="file" accept=".gpx,.json" hidden><button class="iconBtn" id="toggleHud" aria-label="Afficher ou masquer les étapes">−</button></div><div class="hudBody"><div class="stageNav" id="stageNav" hidden><button id="prevStage" aria-label="Nuit précédente">‹</button><strong id="stageSummary">—</strong><button id="nextStage" aria-label="Nuit suivante">›</button></div><div class="projectTools"><button id="undo" disabled>↶ Annuler</button><button id="locate">◎ Moi</button><button id="exportProject" disabled>⇩ Exporter</button></div><div class="projectStatus" id="projectStatus">Trace conservée sur cet appareil</div><button class="addZone" id="bulkZone" disabled>↔ Répartir plusieurs nuits</button><div class="bulkPanel" id="bulkPanel" hidden><div class="bulkTop"><input id="bulkCount" type="number" min="1" max="200" step="1" value="90"><span>bivouacs</span></div><div class="bulkAvg" id="bulkAvg">—</div><div class="bulkActions"><button id="bulkCancel">Annuler</button><button class="bulkApply" id="bulkApply">Créer</button></div></div><div id="zonesList"></div><button class="addZone" id="addZone" disabled>+ Ajouter une nuit</button><div class="remaining" id="remaining">Reste —</div></div></aside>
<div class="mapActions"><button id="locateFab" aria-label="Ma position">◎</button><button class="compareFab" id="compareFab" aria-label="Changer de carte">IGN</button><button class="profileFab" id="profileFab" aria-label="Profil altimétrique">⌁</button><button class="layerFab" id="layerFab" aria-label="Couches">☷</button></div>
<div class="mapStyle mapStyleLeft" id="mapStyleLeft"><select id="basemapLeft" aria-label="Fond de la carte gauche"><option value="sat">Satellite Esri</option><option value="ign">IGN aérien</option><option value="planign">Plan IGN</option><option value="osm">OpenStreetMap</option><option value="topo">OpenTopoMap</option><option value="voyager">Carto Voyager</option><option value="esritopo">Topographique Esri</option></select><label class="overlayToggle"><input type="checkbox" id="hikingOverlay"> Sentiers</label><label class="overlayToggle"><input type="checkbox" id="guidesOverlay"> Sens + bornes km</label></div><div class="mapStyle mapStyleRight" id="mapStyleRight"><select id="basemapRight" aria-label="Fond de la carte droite"><option value="ign">IGN aérien</option><option value="sat">Satellite Esri</option><option value="planign">Plan IGN</option><option value="osm">OpenStreetMap</option><option value="topo">OpenTopoMap</option><option value="voyager">Carto Voyager</option><option value="esritopo">Topographique Esri</option></select></div>
</section>
<section class="profile"><div class="profileHead"><button id="profileScope">Zoom étape</button><span id="profileInfo">—</span></div><div id="profileBox"><svg id="profileSvg"></svg><div id="profileEmpty">—</div><div class="profileCursor" id="profileCursor"></div><div class="cursorLabel" id="cursorLabel"></div></div></section>
</main>

<script>
(function(){
const WINDOW_KM=3;
const COLORS=['#f1b93a','#a475e8','#39b5a7','#ef8650','#5797db','#db6fa3','#8fbd42','#d8a637'];

function drawZones(){clearRelief();S.zoneLayers.forEach(l=>S.map.removeLayer(l));S.zoneLayersIgn.forEach(l=>S.mapIgn.removeLayer(l));S.zoneLayers=[];S.zoneLayersIgn=[];S.zones.forEach((z,i)=>{const b=bounds(i),ll=slice(b[0],b[1]),opts={pane:'zonePane',color:COLORS[i%COLORS.length],weight:7,opacity:.98,interactive:false,lineCap:'round'};S.zoneLayers.push(L.polyline(ll,opts).addTo(S.map));S.zoneLayersIgn.push(L.polyline(ll,opts).addTo(S.mapIgn))});[S.mark,S.markIgn].forEach(m=>m&&m.bringToFront())}

function renderProfile(){if(!S.pts.length)return;const [start,end]=profileBounds(),W=Math.max(600,box.clientWidth),H=Math.max(90,box.clientHeight),L=46,R=56,T=12,B=28,pW=W-L-R,pH=H-T-B,xy=[],alt=[];for(let j=0;j<=Math.min(1500,Math.max(1,Math.ceil((end-start)*10)));j++){const n=Math.min(1500,Math.max(1,Math.ceil((end-start)*10))),km=start+(end-start)*j/n,e=at(km).ele;if(e==null||!isFinite(e))continue;alt.push(e);xy.push([L+j/n*pW,e])}q('#profileScope').textContent=S.focus?'Toute trace':'Zoom étape';if(!xy.length){S.profile.valid=false;svg.replaceChildren();q('#profileEmpty').textContent='Aucune altitude dans ce GPX';return}q('#profileEmpty').textContent='';S.profile.valid=true;let min=Infinity,max=-Infinity;for(const value of alt){min=Math.min(min,value);max=Math.max(max,value)}if(max-min<20){const mid=(min+max)/2;min=mid-10;max=mid+10}const pad=(max-min)*.08;min-=pad;max+=pad;S.profile.min=min;S.profile.max=max;S.profile.start=start;S.profile.end=end;svg.setAttribute('viewBox','0 0 '+W+' '+H);const path=xy.map((p,i)=>(i?'L':'M')+p[0]+','+(T+(1-(p[1]-min)/(max-min))*pH)).join(' '),fill=path+' L '+xy.at(-1)[0]+','+(H-B)+' L '+xy[0][0]+','+(H-B)+' Z';let grid='';[0,.25,.5,.75,1].forEach(f=>{const x=L+f*pW;grid+='<line class="gridline" x1="'+x+'" y1="'+T+'" x2="'+x+'" y2="'+(H-B)+'"></line><text class="axisLabel" x="'+x+'" y="'+(H-8)+'" text-anchor="middle">'+(start+f*(end-start)).toFixed(S.focus?1:0)+' km</text>'});[0,.5,1].forEach(f=>{const y=T+f*pH;grid+='<line class="gridline" x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'"></line><text class="axisLabel" x="6" y="'+(y+4)+'">'+Math.round(max-f*(max-min))+' m</text>'});let zones='';S.zones.forEach((z,i)=>{const b=bounds(i),lo=Math.max(b[0],start),hi=Math.min(b[1],end);if(hi<=lo)return;const x=L+(lo-start)/(end-start)*pW,w=(hi-lo)/(end-start)*pW;zones+='<rect x="'+x+'" y="'+T+'" width="'+w+'" height="'+pH+'" fill="'+COLORS[i%COLORS.length]+'" opacity=".14"></rect>'});svg.innerHTML=grid+zones+'<path class="profileFill"
