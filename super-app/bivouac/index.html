<button class="superHome" id="superHome" aria-label="Retour à l’accueil">🏕️</button>
<main id="app">

<div class="mapGrid"><div class="mapPane mapPaneMain"><div id="map" class="leafletMap"></div></div><div class="mapPane mapPaneIgn"><div id="mapIgn" class="leafletMap"></div></div></div><div id="empty">Importe un GPX</div>
<aside class="hud" id="hud"><div class="hudHead" id="toggleHud" role="button" tabindex="0" aria-expanded="true" aria-label="Afficher ou masquer les bivouacs"><span id="modeTitle">Bivouac de ce soir</span><span class="mobileRemain" id="mobileRemain">—</span><button class="toolsMenuBtn" id="toolsMenuBtn" aria-label="Actions" aria-expanded="false">•••</button><label class="importBtn" for="gpx">Importer</label><input id="gpx" type="file" accept=".gpx,.json" hidden></div><div class="projectTools" id="projectTools"><button id="undo" disabled>↶ Annuler</button><button id="locate">◎ Ma position</button><button id="exportProject" disabled>⇩ Exporter</button></div><div class="hudBody"><div class="modeSwitch" id="modeSwitch"><button data-mode="traverse">Traversée</button><button data-mode="three">3 jours</button></div><div class="stageNav" id="stageNav" hidden><button id="prevStage" aria-label="Nuit précédente">‹</button><strong id="stageSummary">—</strong><button id="nextStage" aria-label="Nuit suivante">›</button></div><button class="addZone" id="bulkZone" disabled>↔ Répartir plusieurs nuits</button><div class="bulkPanel" id="bulkPanel" hidden><div class="bulkTop"><input id="bulkCount" type="number" min="1" max="200" step="1" value="90"><span>bivouacs</span></div><div class="bulkAvg" id="bulkAvg">—</div><div class="bulkActions"><button id="bulkCancel">Annuler</button><button class="bulkApply" id="bulkApply">Créer</button></div></div><div id="zonesList"></div><button class="addZone" id="addZone" disabled>+ Ajouter une nuit</button><div class="remaining" id="remaining">Localise-toi pour commencer</div></div></aside>

<div class="mapStyle mapStyleLeft" id="mapStyleLeft"><select id="basemapLeft" aria-label="Fond de la carte gauche"><option value="sat">Satellite Esri</option><option value="ign">IGN aérien</option><option value="planign">Plan IGN</option><option value="osm">OpenStreetMap</option><option value="topo">OpenTopoMap</option><option value="voyager">Carto Voyager</option><option value="esritopo">Topographique Esri</option></select><label class="overlayToggle"><input type="checkbox" id="hikingOverlay"> Sentiers</label><label class="overlayToggle"><input type="checkbox" id="guidesOverlay"> Sens + bornes km</label></div><div class="mapStyle mapStyleRight" id="mapStyleRight"><select id="basemapRight" aria-label="Fond de la carte droite"><option value="ign">IGN aérien</option><option value="sat">Satellite Esri</option><option value="planign">Plan IGN</option><option value="osm">OpenStreetMap</option><option value="topo">OpenTopoMap</option><option value="voyager">Carto Voyager</option><option value="esritopo">Topographique Esri</option></select></div>
</section>

<script>

const S={map:null,mapIgn:null,pts:[],cum:[],total:0,line:null,lineIgn:null,hitLine:null,hitLineIgn:null,mark:null,markIgn:null,current:null,zoneLayers:[],zoneLayersIgn:[],kmLayers:[],kmLayersIgn:[],dirLayers:[],dirLayersIgn:[],base:null,ignBase:null,hiking:null,guides:false,profile:{min:0,max:0,valid:false},zones:[],moveRAF:0,reliefLayers:[],reliefLayersIgn:[],reliefAbort:null,reliefIndex:-1,selected:0,focus:false,poiLayers:[],undo:[],gpxText:'',restoring:false,touched:false,progressKm:0,completed:[],mode:(localStorage.getItem('bivouac-mode')==='three'?'three':'traverse'),profileChoice:(localStorage.getItem('bivouac-profile')||'j1'),waterPoints:[],waterReady:false};

function clearRelief(){

function offsetPoint(p,prev,next,metres){
 const latRadians=p.lat*Math.PI/180,dx=(next.lng-prev.lng)*Math.cos(latRadians),dy=next.lat-prev.lat;

 return {lat:p.lat+dx/length*metres/111320,lng:p.lng-dy/length*metres/(111320*Math.cos(latRadians))};
}
async function analyzeRelief(i){

  // Environ un échantillon tous les 50 m sur la totalité de la fenêtre ±3 km.
  const steps=Math.max(2,Math.ceil((boundsNow[1]-boundsNow[0])/.05));

   const p=at(km),prev=at(Math.max(0,km-.02)),next=at(Math.min(S.total,km+.02));

  });

  const response=await fetch('https://data.geopf.fr/altimetrie/1.0/calcul/alti/rest/elevation.json',{
   method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({lon:coords.map(p=>p.lng.toFixed(7)).join('|'),lat:coords.map(p=>p.lat.toFixed(7)).join('|'),resource:'ign_rge_alti_wld',delimiter:'|',zonly:'false',measures:'false'}),

  if(controller.signal.aborted)return;

   const a=n*3,b=(n+1)*3;
   if(![z[a],z[a+1],z[a+2],z[b],z[b+1],z[b+2]].every(v=>Number.isFinite(v)&&v>-99999))continue;
   const along=Math.abs(z[b]-z[a])/segmentMetres;
   const across=Math.max(Math.abs(z[a+2]-z[a+1]),Math.abs(z[b+2]-z[b+1]))/30;

   S.reliefLayersIgn.push(L.polyline(line,style).addTo(S.mapIgn));

 }catch(error){
  if(controller.signal.aborted)return;
  S.reliefLayers.forEach(l=>S.map.removeLayer(l));S.reliefLayersIgn.forEach(l=>S.mapIgn.removeLayer(l));
  S.reliefLayers=[];S.reliefLayersIgn=[];
  // Repli limité à la pente du parcours si le service IGN n'est pas joignable.
  const steps=Math.max(2,Math.ceil((boundsNow[1]-boundsNow[0])/.1));
  let valid=0;
  for(let n=0;n<steps;n++){
   const a=boundsNow[0]+(boundsNow[1]-boundsNow[0])*n/steps,b=boundsNow[0]+(boundsNow[1]-boundsNow[0])*(n+1)/steps;

   S.reliefLayersIgn.push(L.polyline(slice(a,b),style).addTo(S.mapIgn));

}
